# =====================================================================
#  Rede Comunitária Vila Aurora - laboratório
#  Etapas 1-3: PKI/mTLS, 5 espaços (broker + sensores + agente de borda),
#  ESP32 no Wokwi via ponte HMAC, VPN WireGuard, ingestão e PostgreSQL
# =====================================================================
name: vila-aurora

x-host-user: &host-user
  # Containers Python rodam com o UID/GID do usuário host (não root).
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

x-broker: &broker
  image: eclipse-mosquitto:2.0
  environment:
    TZ: UTC
  restart: unless-stopped

x-field: &field
  <<: *host-user
  build: ./field
  environment: &field-env
    TZ: UTC
    CERT_ROOT: /certs
    INTERVAL: "5"
  restart: unless-stopped

x-agent: &agent
  build: ./edge/agent
  cap_add: [NET_ADMIN]          # wg-quick e troca de endpoint no failover
  sysctls:
    net.ipv4.ip_forward: 0      # a borda não roteia pacotes de terceiros
  restart: unless-stopped
  depends_on: [cloud-wg]

x-agent-env: &agent-env
  TZ: UTC
  CERT_DIR: /certs
  CLOUD_URL: https://10.13.13.1:8443
  WAN_LINKS: fibra=cloud-fibra:51820,4g=cloud-4g:51820
  FAILOVER_AFTER_S: "30"
  BADGE_PEPPER: ${BADGE_PEPPER:?defina BADGE_PEPPER no .env}

services:
  # =============================================================== CENTRO
  edge-centro-broker:
    <<: *broker
    container_name: edge-centro-broker
    hostname: edge-centro-broker
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge/mosquitto/acl/centro.acl:/mosquitto/config/acl:ro
      - ./pki/out/certs/edge-centro-broker/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./pki/out/certs/edge-centro-broker/edge-centro-broker.crt:/mosquitto/certs/broker.crt:ro
      - ./pki/out/certs/edge-centro-broker/edge-centro-broker.key:/mosquitto/certs/broker.key:ro
      - ./pki/out/crl:/mosquitto/crl:ro
    networks: [seg-iot-centro]

  field-centro:
    <<: *field
    container_name: field-centro
    environment:
      <<: *field-env
      SPACE: centro
      BROKER_HOST: edge-centro-broker
    volumes:
      - ./pki/out/certs/centro-bateria-01:/certs/centro-bateria-01:ro
      - ./pki/out/certs/centro-solar-01:/certs/centro-solar-01:ro
      - ./pki/out/certs/centro-ar-01:/certs/centro-ar-01:ro
    networks: [seg-iot-centro]
    depends_on: [edge-centro-broker]

  edge-centro-agent:
    <<: *agent
    container_name: edge-centro-agent
    environment:
      <<: *agent-env
      SPACE: centro
    volumes:
      - ./pki/out/certs/edge-centro-agent:/certs:ro
      - ./pki/out/wg/edge-centro-agent.conf:/etc/wireguard/wg0.conf:ro
      - outbox-centro:/var/lib/agent
    networks: [seg-iot-centro, seg-wan-fibra, seg-wan-4g]

  # =============================================================== ESCOLA
  edge-escola-broker:
    <<: *broker
    container_name: edge-escola-broker
    hostname: edge-escola-broker
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge/mosquitto/acl/escola.acl:/mosquitto/config/acl:ro
      - ./pki/out/certs/edge-escola-broker/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./pki/out/certs/edge-escola-broker/edge-escola-broker.crt:/mosquitto/certs/broker.crt:ro
      - ./pki/out/certs/edge-escola-broker/edge-escola-broker.key:/mosquitto/certs/broker.key:ro
      - ./pki/out/crl:/mosquitto/crl:ro
    networks: [seg-iot-escola]

  field-escola:
    <<: *field
    container_name: field-escola
    environment:
      <<: *field-env
      SPACE: escola
      BROKER_HOST: edge-escola-broker
    volumes:
      - ./pki/out/certs/escola-turbidez-01:/certs/escola-turbidez-01:ro
      - ./pki/out/certs/escola-cloro-01:/certs/escola-cloro-01:ro
      - ./pki/out/certs/escola-bomba-01:/certs/escola-bomba-01:ro
    networks: [seg-iot-escola]
    depends_on: [edge-escola-broker]

  edge-escola-agent:
    <<: *agent
    container_name: edge-escola-agent
    environment:
      <<: *agent-env
      SPACE: escola
    volumes:
      - ./pki/out/certs/edge-escola-agent:/certs:ro
      - ./pki/out/wg/edge-escola-agent.conf:/etc/wireguard/wg0.conf:ro
      - outbox-escola:/var/lib/agent
    networks: [seg-iot-escola, seg-wan-fibra, seg-wan-4g]

  # Única ponte entre o broker público (Wokwi) e o segmento IoT da escola
  escola-wokwi-bridge:
    <<: *host-user
    build: ./bridge
    container_name: escola-wokwi-bridge
    environment:
      TZ: UTC
      HMAC_FILE: /hmac/escola-nivel-01.json
      EDGE_HOST: edge-escola-broker
      CERT_DIR: /certs
    volumes:
      - ./pki/out/certs/escola-wokwi-bridge:/certs:ro
      - ./pki/out/hmac/escola-nivel-01.json:/hmac/escola-nivel-01.json:ro
    networks: [seg-iot-escola, seg-wan]
    depends_on: [edge-escola-broker]
    restart: unless-stopped

  # ================================================================== UBS
  edge-ubs-broker:
    <<: *broker
    container_name: edge-ubs-broker
    hostname: edge-ubs-broker
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge/mosquitto/acl/ubs.acl:/mosquitto/config/acl:ro
      - ./pki/out/certs/edge-ubs-broker/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./pki/out/certs/edge-ubs-broker/edge-ubs-broker.crt:/mosquitto/certs/broker.crt:ro
      - ./pki/out/certs/edge-ubs-broker/edge-ubs-broker.key:/mosquitto/certs/broker.key:ro
      - ./pki/out/crl:/mosquitto/crl:ro
    networks: [seg-iot-ubs]

  field-ubs:
    <<: *field
    container_name: field-ubs
    environment:
      <<: *field-env
      SPACE: ubs
      BROKER_HOST: edge-ubs-broker
    volumes:
      - ./pki/out/certs/ubs-camara-fria-01:/certs/ubs-camara-fria-01:ro
      - ./pki/out/certs/ubs-acesso-01:/certs/ubs-acesso-01:ro
      - ./data/synthetic/crachas.csv:/data/crachas.csv:ro
    networks: [seg-iot-ubs]
    depends_on: [edge-ubs-broker]

  edge-ubs-agent:
    <<: *agent
    container_name: edge-ubs-agent
    environment:
      <<: *agent-env
      SPACE: ubs
    volumes:
      - ./pki/out/certs/edge-ubs-agent:/certs:ro
      - ./pki/out/wg/edge-ubs-agent.conf:/etc/wireguard/wg0.conf:ro
      - ./data/synthetic/crachas.csv:/data/crachas.csv:ro
      - outbox-ubs:/var/lib/agent
    networks: [seg-iot-ubs, seg-wan-fibra, seg-wan-4g]

  # ================================================================ HORTA
  edge-horta-broker:
    <<: *broker
    container_name: edge-horta-broker
    hostname: edge-horta-broker
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge/mosquitto/acl/horta.acl:/mosquitto/config/acl:ro
      - ./pki/out/certs/edge-horta-broker/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./pki/out/certs/edge-horta-broker/edge-horta-broker.crt:/mosquitto/certs/broker.crt:ro
      - ./pki/out/certs/edge-horta-broker/edge-horta-broker.key:/mosquitto/certs/broker.key:ro
      - ./pki/out/crl:/mosquitto/crl:ro
    networks: [seg-iot-horta]

  field-horta:
    <<: *field
    container_name: field-horta
    environment:
      <<: *field-env
      SPACE: horta
      BROKER_HOST: edge-horta-broker
    volumes:
      - ./pki/out/certs/horta-umidade-01:/certs/horta-umidade-01:ro
      - ./pki/out/certs/horta-cisterna-01:/certs/horta-cisterna-01:ro
    networks: [seg-iot-horta]
    depends_on: [edge-horta-broker]

  edge-horta-agent:
    <<: *agent
    container_name: edge-horta-agent
    environment:
      <<: *agent-env
      SPACE: horta
    volumes:
      - ./pki/out/certs/edge-horta-agent:/certs:ro
      - ./pki/out/wg/edge-horta-agent.conf:/etc/wireguard/wg0.conf:ro
      - outbox-horta:/var/lib/agent
    networks: [seg-iot-horta, seg-wan-fibra, seg-wan-4g]

  # =============================================================== ABRIGO
  edge-abrigo-broker:
    <<: *broker
    container_name: edge-abrigo-broker
    hostname: edge-abrigo-broker
    volumes:
      - ./edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./edge/mosquitto/acl/abrigo.acl:/mosquitto/config/acl:ro
      - ./pki/out/certs/edge-abrigo-broker/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./pki/out/certs/edge-abrigo-broker/edge-abrigo-broker.crt:/mosquitto/certs/broker.crt:ro
      - ./pki/out/certs/edge-abrigo-broker/edge-abrigo-broker.key:/mosquitto/certs/broker.key:ro
      - ./pki/out/crl:/mosquitto/crl:ro
    networks: [seg-iot-abrigo]

  field-abrigo:
    <<: *field
    container_name: field-abrigo
    environment:
      <<: *field-env
      SPACE: abrigo
      BROKER_HOST: edge-abrigo-broker
    volumes:
      - ./pki/out/certs/abrigo-alagamento-01:/certs/abrigo-alagamento-01:ro
      - ./pki/out/certs/abrigo-umidade-01:/certs/abrigo-umidade-01:ro
      - ./pki/out/certs/abrigo-acesso-01:/certs/abrigo-acesso-01:ro
      - ./data/synthetic/crachas.csv:/data/crachas.csv:ro
    networks: [seg-iot-abrigo]
    depends_on: [edge-abrigo-broker]

  edge-abrigo-agent:
    <<: *agent
    container_name: edge-abrigo-agent
    environment:
      <<: *agent-env
      SPACE: abrigo
    volumes:
      - ./pki/out/certs/edge-abrigo-agent:/certs:ro
      - ./pki/out/wg/edge-abrigo-agent.conf:/etc/wireguard/wg0.conf:ro
      - ./data/synthetic/crachas.csv:/data/crachas.csv:ro
      - outbox-abrigo:/var/lib/agent
    networks: [seg-iot-abrigo, seg-wan-fibra, seg-wan-4g]

  # ================================================================ NUVEM
  # Gateway WireGuard: alcançável pelos dois links simulados (fibra e 4G)
  cloud-wg:
    build: ./cloud/wg
    container_name: cloud-wg
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 0    # o gateway NÃO roteia da VPN/WAN para o banco
    volumes:
      - ./pki/out/wg/cloud-wg.conf:/etc/wireguard/wg0.conf:ro
    networks:
      seg-wan-fibra:
        aliases: [cloud-fibra]
      seg-wan-4g:
        aliases: [cloud-4g]
      seg-servicos: {}
    restart: unless-stopped

  # Ingestão: compartilha a rede do gateway; só responde pelo túnel (10.13.13.1)
  cloud-ingest:
    build: ./cloud/ingest
    container_name: cloud-ingest
    network_mode: service:cloud-wg
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      TZ: UTC
      LISTEN: 10.13.13.1
      DB_HOST: postgres
      DB_NAME: vilaaurora
      DB_USER: ingest_writer
      DB_PASSWORD: ${INGEST_DB_PASSWORD:?defina INGEST_DB_PASSWORD no .env}
    volumes:
      - ./pki/out/certs/cloud-ingest:/certs:ro
      - ./pki/out/crl:/crl:ro
    depends_on: [cloud-wg, postgres]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      TZ: UTC
      POSTGRES_DB: vilaaurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?defina INGEST_DB_PASSWORD no .env}
      PAINEL_DB_PASSWORD: ${PAINEL_DB_PASSWORD:?defina PAINEL_DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./cloud/db/init:/docker-entrypoint-initdb.d:ro
    networks: [seg-servicos]
    restart: unless-stopped

  # ============================================ FERRAMENTAS DE TESTE (sob demanda)
  tools:
    <<: *host-user
    build: ./tools
    profiles: ["tools"]
    environment:
      HOME: /tmp
    volumes:
      - ./pki/out/certs:/pki/certs:ro
      - ./pki/out/crl:/pki/crl:ro
      - ./pki/out/hmac/escola-nivel-01.json:/hmac/escola-nivel-01.json:ro
      - ./docs/evidencias:/evidencias
    networks: [seg-iot-centro, seg-iot-escola, seg-iot-ubs, seg-iot-horta, seg-iot-abrigo, seg-wan]

networks:
  # Um segmento IoT por espaço: internos, sem rota para a internet (RT-07).
  seg-iot-centro: {internal: true}
  seg-iot-escola: {internal: true}
  seg-iot-ubs:    {internal: true}
  seg-iot-horta:  {internal: true}
  seg-iot-abrigo: {internal: true}
  # WAN simulada entre bordas e nuvem: dois links independentes.
  seg-wan-fibra: {internal: true}
  seg-wan-4g:    {internal: true}
  # Serviços da nuvem (gateway/ingestão e banco). Sem acesso externo.
  seg-servicos:  {internal: true}
  # Saída para a internet: só a ponte do Wokwi (e as ferramentas de teste).
  seg-wan: {}

volumes:
  pgdata:
  outbox-centro:
  outbox-escola:
  outbox-ubs:
  outbox-horta:
  outbox-abrigo:
