{% extends "base.html" %}
{% block title %}Código MFA{% endblock %}
{% block content %}
<h1>Verificação em duas etapas</h1>
{% if error %}<p class="erro" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="code">Código do aplicativo autenticador</label>
  <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
