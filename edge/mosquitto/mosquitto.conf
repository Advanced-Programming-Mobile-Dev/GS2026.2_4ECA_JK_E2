# =====================================================================
#  Broker MQTT do nó de borda (um por espaço comunitário)
#  mTLS obrigatório: só conecta quem tem certificado da CA do projeto
#  (RT-04), com CRL para revogação (RT-05) e ACL por identidade.
# =====================================================================

per_listener_settings false
allow_anonymous false
persistence false

# ---------- Listener TLS (único; não existe porta 1883 em texto puro) ----
listener 8883
protocol mqtt
tls_version tlsv1.2
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile  /mosquitto/certs/broker.key
crlfile  /mosquitto/crl/crl.pem
require_certificate true
# O CN do certificado do cliente vira o "usuário" usado na ACL
use_identity_as_username true

acl_file /mosquitto/config/acl

# ---------- Logs (stdout, horário UTC, para o SIEM) ----------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ
